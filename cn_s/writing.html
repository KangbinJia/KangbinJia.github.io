<!-- Writing Section Content -->
<section id="writing" class="section">
    <style>
        .writing-table .btn-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3.6rem;
            min-height: 3.6rem;
            padding: 0.8rem 1rem;
            font-size: 1.5rem;
            line-height: 1;
        }

        .writing-language-section {
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.6);
        }

        .writing-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            cursor: pointer;
            background: rgba(8, 145, 178, 0.08);
        }

        .writing-section-header h3 {
            margin: 0;
        }

        .writing-section-toggle {
            border: none;
            background: transparent;
            color: var(--primary-color, #0f766e);
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: 600;
            line-height: 1;
            padding: 0.25rem 0.4rem;
        }

        .writing-section-content {
            padding: 1rem 1.25rem 1.25rem;
        }

        .writing-language-section.is-collapsed .writing-section-content {
            display: none;
        }

        .writing-language-section:not(.is-collapsed) .writing-section-toggle {
            transform: rotate(90deg);
            transition: transform 0.2s ease;
        }

        .writing-section-toggle {
            transition: transform 0.2s ease;
        }
    </style>
    <div class="container">
        <div class="section-header">
            <p class="section-title">研究与写作</p>
            <h2>写作</h2>
        </div>

        <p style="text-align: center; margin-bottom: 3rem; color: var(--text-light);">
            这里收录了我的学术和创意写作作品。每篇作品都会提供可下载的 PDF(如有,还会提供 LaTeX 源文件)。
        </p>

        <!-- 英文写作 -->
        <div class="writing-language-section is-collapsed">
            <div class="writing-section-header" data-toggle-target="english-content">
                <h3 class="language-title">🇺🇸 英文</h3>
                <button class="writing-section-toggle" type="button" aria-expanded="false">▶</button>
            </div>
            <div id="english-content" class="writing-section-content">
                <div class="writing-table-container">
                    <table class="writing-table">
                    <thead>
                        <tr>
                            <th>标题</th>
                            <th>发表日期</th>
                            <th>LaTeX(下载)</th>
                            <th>PDF</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--text-light); padding: 2rem;">暂无作品,快来添加第一篇吧!</td>
                        </tr>
                    </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 中文写作 -->
        <div class="writing-language-section is-collapsed">
            <div class="writing-section-header" data-toggle-target="chinese-content">
                <h3 class="language-title">🇨🇳 中文</h3>
                <button class="writing-section-toggle" type="button" aria-expanded="false">▶</button>
            </div>
            <div id="chinese-content" class="writing-section-content">
                <div class="writing-table-container">
                    <table class="writing-table">
                    <thead>
                        <tr>
                            <th>标题</th>
                            <th>发表日期</th>
                            <th>LaTeX(下载)</th>
                            <th>PDF</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--text-light); padding: 2rem;">暂无作品,快来添加第一篇吧!</td>
                        </tr>
                    </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 西班牙语写作 -->
        <div class="writing-language-section is-collapsed">
            <div class="writing-section-header" data-toggle-target="spanish-content">
                <h3 class="language-title">🇪🇸 西班牙语</h3>
                <button class="writing-section-toggle" type="button" aria-expanded="false">▶</button>
            </div>
            <div id="spanish-content" class="writing-section-content">
                <div class="writing-table-container">
                    <table class="writing-table">
                    <thead>
                        <tr>
                            <th>标题</th>
                            <th>发表日期</th>
                            <th>LaTeX(下载)</th>
                            <th>PDF</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--text-light); padding: 2rem;">暂无作品,快来添加第一篇吧!</td>
                        </tr>
                    </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    function initWritingSectionToggles() {
        document.querySelectorAll('.writing-section-header').forEach(function (header) {
            header.addEventListener('click', function () {
                const section = header.closest('.writing-language-section');
                const targetId = header.getAttribute('data-toggle-target');
                const content = document.getElementById(targetId);
                const button = header.querySelector('.writing-section-toggle');

                if (!section || !content || !button) return;

                const isCollapsed = section.classList.toggle('is-collapsed');
                const expanded = !isCollapsed;
                button.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initWritingSectionToggles);
    } else {
        initWritingSectionToggles();
    }
</script>
